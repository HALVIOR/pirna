<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Knk Özel Gece 🔥 V2</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(to bottom, #000022, #220033);
      color: #ff69b4;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      text-align: center;
    }
    h1 {
      font-size: 2.5rem;
      margin: 10px;
      text-shadow: 0 0 15px #ff00aa;
    }
    #character {
      position: relative;
      width: 300px;
      height: 500px;
      background: #111;
      border-radius: 30px;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(255,0,170,0.6);
      cursor: pointer;
      margin: 20px;
    }
    .layer {
      position: absolute;
      inset: 0;
      transition: opacity 0.8s ease, transform 0.5s;
      background-size: cover;
      background-position: center;
      pointer-events: none;
    }
    #body { background: #f5d0b0; opacity: 1; } /* çıplak vücut */
    #dress { background: linear-gradient(#ff69b4, #c71585); opacity: 1; }
    #bra { background: #ff1493; opacity: 1; top: 100px; height: 150px; }
    #panties { background: #ff0066; opacity: 1; top: 300px; height: 150px; }
    #horny-meter {
      width: 300px;
      height: 30px;
      background: #222;
      border: 2px solid #ff69b4;
      border-radius: 15px;
      overflow: hidden;
      margin: 20px;
    }
    #horny-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #ff0066, #ff3399);
      transition: width 0.5s;
    }
    button {
      padding: 12px 30px;
      font-size: 1.2rem;
      background: #ff0066;
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255,0,100,0.7);
      transition: all 0.3s;
      margin: 5px;
    }
    button:hover { transform: scale(1.1); background: #ff3399; }
    #progress { font-size: 1.6rem; margin: 10px; text-shadow: 0 0 10px #ff00ff; }
    #scene-text { font-size: 1.3rem; max-width: 80%; margin: 20px; line-height: 1.5; color: #ffb6c1; }
    #position-buttons { display: none; flex-wrap: wrap; justify-content: center; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    .climax { animation: pulse 1s infinite; }
  </style>
</head>
<body>

  <h1>Knk Özel Gece 😈 V2</h1>
  <div id="progress">Seviye: 0/5 - Horny: 0%</div>

  <div id="character" onclick="nextLevel()">
    <div class="layer" id="body"></div>
    <div class="layer" id="dress"></div>
    <div class="layer" id="bra"></div>
    <div class="layer" id="panties"></div>
  </div>

  <div id="horny-meter">
    <div id="horny-fill"></div>
  </div>

  <button id="main-button" onclick="nextLevel()">Tıkla & İlerle 🔥</button>
  <div id="position-buttons">
    <button onclick="selectPosition('missionary')">Missionary</button>
    <button onclick="selectPosition('doggy')">Doggy Style</button>
    <button onclick="selectPosition('cowgirl')">Cowgirl</button>
    <button onclick="selectPosition('anal')">Anal</button>
  </div>
  <div id="scene-text">Başla knk... İlk dokunuşu sen yap 😏</div>

  <script>
    let level = 0;
    let horny = 0;
    const maxLevel = 5;
    const progress = document.getElementById("progress");
    const fill = document.getElementById("horny-fill");
    const text = document.getElementById("scene-text");
    const char = document.getElementById("character");
    const mainButton = document.getElementById("main-button");
    const posButtons = document.getElementById("position-buttons");

    function updateHorny(add) {
      horny = Math.min(100, horny + add);
      fill.style.width = horny + "%";
      if (horny >= 100) {
        char.classList.add("climax");
        text.innerHTML += "<br>Ohaaa... patlıyoruz knk! 🔥💦 Her yer titriyor, boşalıyoruz birlikte... Ahhh!";
        setTimeout(() => {
          alert("Climax! Devam mı istiyorsun yoksa reset mi?");
          resetGame();
        }, 3000);
      }
    }

    function nextLevel() {
      if (horny >= 100 || level >= 3) return; // seviye 3'ten sonra pozisyon seç
      level++;
      progress.textContent = `Seviye: ${level}/${maxLevel} - Horny: ${horny}%`;

      if (level === 1) {
        document.getElementById("dress").style.opacity = "0";
        text.innerHTML = "Elbise düştü... Göğüsler ortaya çıktı, sertleşmiş meme uçları belli 😏";
        updateHorny(20);
      } else if (level === 2) {
        document.getElementById("bra").style.opacity = "0";
        text.innerHTML = "Sütyen gitti... Göğüslerini avuçluyorum, inliyor yavaşça... Ah knk...";
        updateHorny(25);
      } else if (level === 3) {
        document.getElementById("panties").style.opacity = "0";
        text.innerHTML = "Külot sıyrıldı... Islak amı ortaya çıktı, parmaklarım içeri kayıyor... Sırılsıklam! Şimdi pozisyon seç knk...";
        updateHorny(20);
        mainButton.style.display = "none";
        posButtons.style.display = "flex";
      }
    }

    function selectPosition(pos) {
      level = 4; // pozisyon seviyesi
      let scene = "";
      let addHorny = 25;

      if (pos === "missionary") {
        scene = "Missionary'de uzanıyor... Sikimi amına dayadım, yavaşça giriyorum. Gözlerime bakıyor, inliyor derin derin... İçinde kayıyorum, sıcacık!";
      } else if (pos === "doggy") {
        scene = "Doggy style'da döndürdüm... Kalçalarını tuttum, arkadan sertçe sokuyorum. Tokat atıyorum, çığlık atıyor zevkten... Derine, daha derine!";
        addHorny = 30;
      } else if (pos === "cowgirl") {
        scene = "Cowgirl'de üstüme oturdu... Kendisi zıplıyor, sikim tamamen içinde. Göğüsleri sallanıyor, ellerim kalçalarında... Hızlanıyor!";
      } else if (pos === "anal") {
        scene = "Anal için yağladım... Yavaşça arkadan giriyorum, daracık hissediyorum. İnliyor acı-zevk karışımı... Pompalıyorum, boşalmak üzere!";
        addHorny = 35;
      }

      text.innerHTML = scene;
      updateHorny(addHorny);
      posButtons.style.display = "none";
      mainButton.style.display = "block";
      mainButton.textContent = "Hızlan & Bitir 💦";

      // Son tıklama için override
      mainButton.onclick = function() {
        level = 5;
        text.innerHTML = "Hızlanıyoruz... Sertçe devam ediyorum, her vuruşta titriyor! Geliyorum knk... İçine/üstüne boşalıyorum! 💦💦";
        updateHorny(100 - horny); // direkt climax
      };
    }

    function resetGame() {
      level = 0;
      horny = 0;
      fill.style.width = "0%";
      progress.textContent = "Seviye: 0/5 - Horny: 0%";
      document.querySelectorAll(".layer").forEach(el => el.style.opacity = "1");
      char.classList.remove("climax");
      text.innerHTML = "Yeniden mi başlıyoruz knk? 😈";
      mainButton.style.display = "block";
      mainButton.textContent = "Tıkla & İlerle 🔥";
      posButtons.style.display = "none";
      mainButton.onclick = nextLevel;
    }
  </script>

</body>
</html>
